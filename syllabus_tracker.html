<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSC CGL Syllabus Tracker</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --border-color: #334155;
        --accent-color: #38bdf8;
        --success-color: #10b981;
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: "Inter", sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }

      /* --- STICKY HEADER --- */
      .header {
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(10px);
        padding: 15px 30px;
        position: sticky;
        top: 0;
        z-index: 100;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo {
        font-size: 1.2rem;
        font-weight: 800;
        color: var(--accent-color);
      }

      .global-progress {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .progress-label {
        font-size: 0.9rem;
        color: var(--text-muted);
      }
      .progress-val {
        color: var(--text-main);
        font-weight: bold;
      }

      .btn-reset {
        background: transparent;
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        padding: 5px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.8rem;
      }
      .btn-reset:hover {
        border-color: #ef4444;
        color: #ef4444;
      }

      /* --- MAIN LAYOUT --- */
      .container {
        max-width: 1200px;
        margin: 30px auto;
        padding: 0 20px;
      }

      /* --- TABS --- */
      .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 25px;
        overflow-x: auto;
        padding-bottom: 5px;
      }

      .tab-btn {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        padding: 12px 24px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s;
        white-space: nowrap;
      }

      .tab-btn:hover {
        background: #2d3b4e;
      }

      .tab-btn.active {
        background: var(--accent-color);
        color: #0f172a;
        border-color: var(--accent-color);
      }

      /* --- SUBJECT SECTION --- */
      .subject-section {
        display: none;
        animation: fadeIn 0.3s ease;
      }
      .subject-section.active {
        display: block;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* --- TOPIC CARDS --- */
      .topic-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        gap: 20px;
      }

      .topic-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 20px;
        transition: transform 0.2s;
      }

      .topic-card:hover {
        transform: translateY(-2px);
        border-color: #475569;
      }

      .topic-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }

      .topic-title {
        font-weight: 700;
        font-size: 1rem;
      }

      .completion-badge {
        font-size: 0.75rem;
        padding: 2px 8px;
        border-radius: 10px;
        background: #334155;
        color: #cbd5e1;
      }

      .topic-card.done .completion-badge {
        background: rgba(16, 185, 129, 0.2);
        color: var(--success-color);
      }

      /* --- CHECKBOX GRID --- */
      .tracker-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
      }

      .check-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        padding: 10px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid transparent;
        transition: all 0.2s;
      }

      .check-item:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      .check-item.checked {
        background: rgba(56, 189, 248, 0.1);
        border-color: rgba(56, 189, 248, 0.3);
      }

      .checkbox-custom {
        width: 20px;
        height: 20px;
        border: 2px solid var(--text-muted);
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
      }

      .check-item.checked .checkbox-custom {
        background: var(--accent-color);
        border-color: var(--accent-color);
      }

      .check-item.checked .checkbox-custom::after {
        content: "✓";
        color: #0f172a;
        font-weight: bold;
        font-size: 14px;
      }

      .label {
        font-size: 0.8rem;
        color: var(--text-muted);
        font-weight: 500;
      }
      .check-item.checked .label {
        color: var(--accent-color);
      }

      /* --- SUBJECT PROGRESS BAR --- */
      .subject-progress-container {
        margin-bottom: 20px;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 8px;
        padding: 15px;
        border: 1px solid var(--border-color);
      }

      .sub-prog-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 0.9rem;
      }

      .progress-track {
        height: 8px;
        background: #334155;
        border-radius: 10px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--accent-color), #818cf8);
        width: 0%;
        transition: width 0.4s ease;
      }
      /* --- NAVIGATION BAR CSS --- */
      nav {
        background: #1e293b;
        border-bottom: 1px solid #334155;
        padding: 15px 20px;
        display: flex;
        gap: 15px;
        justify-content: center;
        position: sticky;
        top: 0;
        z-index: 1000;
      }
      nav a {
        color: #94a3b8;
        text-decoration: none;
        font-weight: 600;
        padding: 8px 16px;
        border-radius: 6px;
        transition: all 0.2s;
        cursor: pointer;
      }
      nav a:hover,
      nav a.active {
        background: #334155;
        color: #f1f5f9;
      }
      /* Push the existing header down slightly */
      .header {
        top: 60px !important;
      }
    </style>
  </head>
  <body>
    <nav
      style="
        background: #1e293b;
        border-bottom: 1px solid #334155;
        padding: 15px;
        display: flex;
        gap: 15px;
        justify-content: center;
        position: sticky;
        top: 0;
        z-index: 2000;
      "
    >
      <a
        href="index.html"
        style="
          color: #94a3b8;
          text-decoration: none;
          font-weight: 600;
          padding: 8px 16px;
          border-radius: 6px;
        "
        >📅 Daily Plan</a
      >
      <a
        href="syllabus_tracker.html"
        style="
          background: #334155;
          color: white;
          text-decoration: none;
          font-weight: 600;
          padding: 8px 16px;
          border-radius: 6px;
        "
        >📚 Syllabus</a
      >
      <a
        href="mock_scores.html"
        style="
          color: #94a3b8;
          text-decoration: none;
          font-weight: 600;
          padding: 8px 16px;
          border-radius: 6px;
        "
        >📊 Mock Scores</a
      >
      <a
        href="quiz_log.html"
        style="
          color: #94a3b8;
          text-decoration: none;
          font-weight: 600;
          padding: 8px 16px;
          border-radius: 6px;
        "
        >🧠 Quiz Log</a
      >
    </nav>

    <div class="header">
      <div class="logo">SYLLABUS TRACKER</div>
      <div class="global-progress">
        <span class="progress-label"
          >Total Progress:
          <span id="total-percent" class="progress-val">0%</span></span
        >
        <button class="btn-reset" onclick="resetAll()">Reset</button>
      </div>
    </div>

    <div class="container">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('quant')">
          Quantitative Aptitude
        </button>
        <button class="tab-btn" onclick="switchTab('reasoning')">
          Reasoning
        </button>
        <button class="tab-btn" onclick="switchTab('english')">English</button>
        <button class="tab-btn" onclick="switchTab('gs')">
          General Awareness
        </button>
      </div>

      <div id="content-area"></div>
    </div>

    <script>
      // --- SYLLABUS DATA ---
      const syllabus = {
        quant: {
          name: "Quantitative Aptitude",
          topics: [
            "Number System",
            "LCM & HCF",
            "Simplification",
            "Power, Indices & Surds",
            "Average",
            "Ratio & Proportion",
            "Mixture & Alligation",
            "Percentage",
            "Profit & Loss",
            "Discount",
            "Simple Interest",
            "Compound Interest",
            "Time & Work",
            "Pipe & Cistern",
            "Time, Speed & Distance",
            "Boat & Stream",
            "Algebra",
            "Trigonometry",
            "Geometry (Triangles)",
            "Geometry (Circles)",
            "Geometry (Quadrilaterals)",
            "Mensuration 2D",
            "Mensuration 3D",
            "Coordinate Geometry",
            "Data Interpretation",
          ],
        },
        reasoning: {
          name: "General Intelligence & Reasoning",
          topics: [
            "Analogy (Verbal)",
            "Classification (Odd One Out)",
            "Coding-Decoding",
            "Series (Number/Letter)",
            "Missing Number",
            "Blood Relations",
            "Direction & Distance",
            "Clock & Calendar",
            "Dice & Cube",
            "Ranking & Arrangement",
            "Syllogism",
            "Venn Diagram",
            "Mathematical Operations",
            "Word Formation",
            "Mirror & Water Image",
            "Paper Cutting & Folding",
            "Embedded Figures",
            "Figure Counting",
            "Matrix",
          ],
        },
        english: {
          name: "English Comprehension",
          topics: [
            "Nouns",
            "Pronouns",
            "Verbs",
            "Adjectives",
            "Adverbs",
            "Prepositions",
            "Conjunctions",
            "Articles",
            "Subject-Verb Agreement",
            "Tenses",
            "Active & Passive Voice",
            "Direct & Indirect Speech",
            "Spotting Errors",
            "Sentence Improvement",
            "One Word Substitution",
            "Idioms & Phrases",
            "Synonyms & Antonyms",
            "Spelling Correction",
            "Cloze Test",
            "Reading Comprehension",
            "Para Jumbles",
          ],
        },
        gs: {
          name: "General Awareness",
          topics: [
            "Ancient History",
            "Medieval History",
            "Modern History",
            "Polity",
            "Geography",
            "Indian Geography",
            "Economics",
            "Physics",
            "Chemistry",
            "Biology",
            "Computer Basics",
            "Static GK (Dance, Art, Books)",
            "Current Affairs (Last 6 Months)",
          ],
        },
      };

      // State object to hold progress
      let progressData =
        JSON.parse(localStorage.getItem("sscTrackerData")) || {};

      const contentArea = document.getElementById("content-area");

      // --- INITIALIZATION ---
      function init() {
        renderAllSubjects();
        updateUI();
      }

      // --- RENDER FUNCTIONS ---
      function renderAllSubjects() {
        contentArea.innerHTML = "";

        Object.keys(syllabus).forEach((key, index) => {
          const subject = syllabus[key];
          const isActive = index === 0 ? "active" : ""; // First tab active by default

          const section = document.createElement("div");
          section.className = `subject-section ${isActive}`;
          section.id = `section-${key}`;

          // Subject Progress Header
          let html = `
                <div class="subject-progress-container">
                    <div class="sub-prog-header">
                        <span>${subject.name} Progress</span>
                        <span id="prog-text-${key}">0%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="prog-bar-${key}"></div>
                    </div>
                </div>
                <div class="topic-list">
            `;

          // Render Topics
          subject.topics.forEach((topic) => {
            const topicId = sanitize(topic);

            // Check current state
            const p = progressData[topicId] || {
              concept: false,
              practice: false,
              revision: false,
            };
            const isDone = p.concept && p.practice && p.revision;

            html += `
                    <div class="topic-card ${isDone ? "done" : ""}" id="card-${topicId}">
                        <div class="topic-header">
                            <span class="topic-title">${topic}</span>
                            <span class="completion-badge">${isDone ? "COMPLETED" : "IN PROGRESS"}</span>
                        </div>
                        <div class="tracker-grid">
                            ${renderCheck(topicId, "concept", "Concept", p.concept)}
                            ${renderCheck(topicId, "practice", "Practice", p.practice)}
                            ${renderCheck(topicId, "revision", "Revision", p.revision)}
                        </div>
                    </div>
                `;
          });

          html += `</div>`; // Close topic-list
          section.innerHTML = html;
          contentArea.appendChild(section);
        });
      }

      function renderCheck(id, type, label, isChecked) {
        return `
            <div class="check-item ${isChecked ? "checked" : ""}" 
                 onclick="toggleCheck('${id}', '${type}')">
                <div class="checkbox-custom"></div>
                <span class="label">${label}</span>
            </div>
        `;
      }

      // --- LOGIC HANDLERS ---
      function toggleCheck(topicId, type) {
        if (!progressData[topicId]) {
          progressData[topicId] = {
            concept: false,
            practice: false,
            revision: false,
          };
        }

        // Toggle state
        progressData[topicId][type] = !progressData[topicId][type];

        saveData();
        updateUI();
      }

      function updateUI() {
        let totalItems = 0;
        let totalChecked = 0;

        // Loop through syllabus to calculate stats per subject
        Object.keys(syllabus).forEach((key) => {
          const topics = syllabus[key].topics;
          let subjectItems = 0;
          let subjectChecked = 0;

          topics.forEach((topic) => {
            const id = sanitize(topic);
            const p = progressData[id] || {
              concept: false,
              practice: false,
              revision: false,
            };

            // Update Checkboxes visually
            const card = document.getElementById(`card-${id}`);
            const checks = card.querySelectorAll(".check-item");

            // Update DOM classes for Concept(0), Practice(1), Revision(2)
            updateCheckVisual(checks[0], p.concept);
            updateCheckVisual(checks[1], p.practice);
            updateCheckVisual(checks[2], p.revision);

            // Update Card "Done" status
            if (p.concept && p.practice && p.revision) {
              card.classList.add("done");
              card.querySelector(".completion-badge").innerText = "COMPLETED";
            } else {
              card.classList.remove("done");
              card.querySelector(".completion-badge").innerText = "IN PROGRESS";
            }

            // Counts
            subjectItems += 3; // 3 checkboxes per topic
            if (p.concept) subjectChecked++;
            if (p.practice) subjectChecked++;
            if (p.revision) subjectChecked++;
          });

          // Update Subject Progress Bar
          const percent =
            Math.round((subjectChecked / subjectItems) * 100) || 0;
          document.getElementById(`prog-bar-${key}`).style.width =
            `${percent}%`;
          document.getElementById(`prog-text-${key}`).innerText = `${percent}%`;

          totalItems += subjectItems;
          totalChecked += subjectChecked;
        });

        // Update Global Header Stats
        const globalPercent =
          Math.round((totalChecked / totalItems) * 100) || 0;
        document.getElementById("total-percent").innerText =
          `${globalPercent}%`;
      }

      function updateCheckVisual(el, isChecked) {
        if (isChecked) el.classList.add("checked");
        else el.classList.remove("checked");
      }

      // --- UTILITIES ---
      function switchTab(subjectKey) {
        // Hide all sections
        document
          .querySelectorAll(".subject-section")
          .forEach((el) => el.classList.remove("active"));
        // Show target section
        document
          .getElementById(`section-${subjectKey}`)
          .classList.add("active");

        // Update Buttons
        document
          .querySelectorAll(".tab-btn")
          .forEach((btn) => btn.classList.remove("active"));
        event.target.classList.add("active");
      }

      function sanitize(str) {
        return str.replace(/[^a-zA-Z0-9]/g, "");
      }

      function saveData() {
        localStorage.setItem("sscTrackerData", JSON.stringify(progressData));
      }

      function resetAll() {
        if (confirm("Are you sure you want to reset all syllabus progress?")) {
          progressData = {};
          saveData();
          init(); // Re-render to clear visual state immediately
        }
      }

      // Run on load
      init();
    </script>
  </body>
</html>
