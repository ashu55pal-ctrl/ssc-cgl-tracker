<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>103 Day Challenge - SSC CGL</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0f172a;       
            --bg-panel: #1e293b;      
            --border: #334155;        
            --text-main: #cbd5e1;     
            --text-muted: #64748b;    
            --accent: #38bdf8;        
            --green: #10b981;         
            --hover: rgba(255, 255, 255, 0.05);
        }

        body { background: var(--bg-main); color: var(--text-main); font-family: 'Inter', sans-serif; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* TOP NAVIGATION */
        nav { background: var(--bg-panel); border-bottom: 1px solid var(--border); padding: 12px; display: flex; gap: 20px; justify-content: center; z-index: 100; flex-shrink: 0; }
        nav a { color: #94a3b8; text-decoration: none; font-weight: 600; font-size: 0.95rem; padding: 6px 12px; border-radius: 6px; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
        nav a:hover { background: var(--border); color: white; }
        nav a.active { background: rgba(255,255,255,0.1); color: white; }

        /* HEADER SECTION */
        .challenge-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .header-title { margin: 0; color: var(--accent); font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; }
        .progress-section { display: flex; align-items: center; gap: 15px; font-size: 0.9rem; font-weight: 600; }
        .progress-bar-container { width: 200px; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--green); width: 0%; transition: width 0.3s ease; }

        /* TABLE CONTAINER (Scrollable Area) */
        .table-wrapper { flex: 1; overflow: auto; padding: 0 30px 30px 30px; }
        table { width: 100%; border-collapse: collapse; margin-top: -1px; }
        
        /* NORMAL TABLE HEADERS (These will scroll up and hide) */
        thead th { 
            background: var(--bg-panel); 
            color: white; 
            font-weight: 700; 
            font-size: 0.85rem; 
            padding: 16px 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid var(--border);
        }

        /* STICKY TIME SLOT HEADER (Only this row sticks to the top) */
        .sticky-header th {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--bg-panel); /* Opaque background so scrolling text doesn't show through */
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); /* Shadow to separate it from scrolling rows */
            border-bottom: 2px solid var(--accent); /* Blue accent line below sticky header */
        }

        /* TABLE BODY CELLS */
        td { padding: 14px 10px; text-align: center; border: 1px solid var(--border); font-size: 0.9rem; transition: all 0.15s ease; }
        
        .col-day { font-weight: 800; color: var(--accent); font-size: 1rem; background: rgba(0,0,0,0.2); width: 60px;}
        .col-date { color: var(--text-muted); font-size: 0.85rem; font-weight: 600; background: rgba(0,0,0,0.2); width: 100px;}
        
        .is-today { background: rgba(56, 189, 248, 0.05); }
        .is-today .col-day, .is-today .col-date { color: white; border-top: 1px solid var(--accent); border-bottom: 1px solid var(--accent);}
        
        /* CLICKABLE TARGET CELLS */
        .cell-target { cursor: pointer; color: #94a3b8; user-select: none; }
        .cell-target:hover { background: var(--hover); color: white; }
        .cell-done { background: var(--green) !important; color: white !important; font-weight: 700; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="active">📅 Daily Plan ☁️</a>
        <a href="syllabus_tracker.html">📚 Syllabus</a>
        <a href="mock_scores.html">📊 Mock Scores</a>
        <a href="quiz_log.html">🧠 Quiz Log ☁️</a>
    </nav>

    <div class="challenge-header">
        <h1 class="header-title">103 DAY CHALLENGE</h1>
        <div class="progress-section">
            <span id="cloudStatus" style="color: var(--accent); font-size: 0.8rem; margin-right: 15px;">⏳ Syncing...</span>
            <span style="color: #94a3b8;">Progress: <strong id="progressText" style="color: white;">0%</strong></span>
            <div class="progress-bar-container"><div class="progress-fill" id="progressBar"></div></div>
        </div>
    </div>

    <div class="table-wrapper">
        <table id="trackerTable">
            <thead>
                <tr>
                    <th colspan="2" rowspan="2" style="background: #162032; color: var(--accent); font-size: 1.4rem; font-weight: 800; vertical-align: middle;">
                        DAY <span id="currentDayDisplay" style="color: white;">0</span><span style="font-size: 0.9rem; color: #94a3b8;">/103</span>
                    </th>
                    <th colspan="3">SSC Group</th>
                    <th colspan="2">RRB Group</th>
                    <th>UPSI</th>
                </tr>
                <tr>
                    <th style="color: #fca5a5;">RBE Daily Targets</th>
                    <th style="color: #fcd34d;">GS PARMAR 4.0</th>
                    <th style="color: #86efac;">ENGLISH AMAN SIR</th>
                    <th style="color: #93c5fd;">GS</th>
                    <th style="color: #c4b5fd;">MATH/RESONING</th>
                    <th style="color: #fbcfe8;">Hindi</th>
                </tr>
                <tr class="sticky-header">
                    <th>DAY</th>
                    <th>DATE</th>
                    <th>9AM - 3PM</th>
                    <th>3.30PM - 5PM</th>
                    <th>5PM - 6PM</th>
                    <th>8PM - 9PM</th>
                    <th>10PM - 12PM</th>
                    <th>12AM - 2AM</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>

<script type="module">
    // --- FIREBASE CLOUD SETUP ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCVAXOdqKnBgFKSe3tKn0omfeib4AdfzVU",
      authDomain: "ssc-command-center-285cd.firebaseapp.com",
      projectId: "ssc-command-center-285cd",
      storageBucket: "ssc-command-center-285cd.firebasestorage.app",
      messagingSenderId: "512383276315",
      appId: "1:512383276315:web:95da05a6a05d3efb48efbe",
      measurementId: "G-G3DWYBB80L"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- TABLE GENERATION ---
    const TOTAL_DAYS = 103; 
    const START_DATE = new Date('2026-02-18T00:00:00'); 
    
    function generateTable() {
        const tbody = document.getElementById('tableBody');
        let html = '';
        let activeDayNumber = "0"; 

        const todayStr = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' }).replace(/\//g, '-');

        for (let i = 1; i <= TOTAL_DAYS; i++) {
            const d = new Date(START_DATE);
            d.setDate(START_DATE.getDate() + (i - 1));
            
            const dd = String(d.getDate()).padStart(2, '0');
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const yyyy = d.getFullYear();
            const dateStr = `${dd}-${mm}-${yyyy}`;

            const isToday = (dateStr === todayStr);
            const rowClass = isToday ? 'is-today' : '';
            const rowId = isToday ? 'todayRow' : `row-${i}`;

            if (isToday) activeDayNumber = i;

            // Helper function to create clickable cells
            const createCell = (slotNum, text) => `
                <td class="cell-target" id="d${i}-s${slotNum}" onclick="window.toggleCell('d${i}-s${slotNum}', this)">
                    ${text}
                </td>
            `;

            html += `
                <tr class="${rowClass}" id="${rowId}">
                    <td class="col-day">${i}</td>
                    <td class="col-date">${dateStr}</td>
                    ${createCell(1, `RBE Daily targets`)}
                    ${createCell(2, `Polity - ${i}`)}
                    ${createCell(3, `Lecture - ${i}`)}
                    ${createCell(4, `PARMAR PYQ - ${i}`)}
                    ${createCell(5, i % 7 === 0 ? `FULL MOCK - ${i/7}` : `MATH/REASONING`)}
                    ${createCell(6, `Lecture till-${i * 3}`)}
                </tr>
            `;
        }

        tbody.innerHTML = html;
        document.getElementById('currentDayDisplay').innerText = activeDayNumber;
        
        // Auto-scroll to today
        setTimeout(() => {
            const row = document.getElementById('todayRow');
            if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 500);
    }

    // --- CELL TOGGLE & CLOUD SYNC LOGIC ---
    window.toggleCell = async (id, tdElement) => {
        const isCompleted = tdElement.classList.toggle('cell-done');
        window.updateProgressBar();

        document.getElementById('cloudStatus').innerText = "☁️ Saving...";
        try {
            await setDoc(doc(db, "ssc_daily_plan", "progress_v3"), {
                [id]: isCompleted
            }, { merge: true });
            document.getElementById('cloudStatus').innerText = "☁️ Synced";
        } catch(e) {
            console.error("Firebase Sync Error", e);
            document.getElementById('cloudStatus').innerText = "❌ Sync Error";
            tdElement.classList.toggle('cell-done');
            window.updateProgressBar();
        }
    };

    // --- PROGRESS BAR ---
    window.updateProgressBar = () => {
        const total = document.querySelectorAll('.cell-target').length;
        const completed = document.querySelectorAll('.cell-done').length;
        const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);
        
        document.getElementById('progressBar').style.width = percentage + '%';
        document.getElementById('progressText').innerText = percentage + '%';
    };

    // --- LOAD CLOUD DATA ON STARTUP ---
    async function loadCloudProgress() {
        try {
            const docSnap = await getDoc(doc(db, "ssc_daily_plan", "progress_v3"));
            if (docSnap.exists()) {
                const data = docSnap.data();
                for (const [id, isCompleted] of Object.entries(data)) {
                    if (isCompleted) {
                        const cell = document.getElementById(id);
                        if (cell) cell.classList.add('cell-done');
                    }
                }
                window.updateProgressBar();
            }
            document.getElementById('cloudStatus').innerText = "☁️ Synced";
        } catch(e) {
            console.error("Error loading cloud data", e);
            document.getElementById('cloudStatus').innerText = "❌ Offline";
        }
    }

    // Initialize the Application
    generateTable();
    loadCloudProgress();

</script>
</body>
</html>
