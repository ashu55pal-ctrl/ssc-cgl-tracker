<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC CGL 103-Day Command Center</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --border: #334155; --text: #f1f5f9; --muted: #94a3b8;
            --accent: #38bdf8; --green: #10b981; --red: #ef4444; --yellow: #f59e0b;
        }

        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; }
        
        /* NAV BAR */
        nav { background: var(--card); border-bottom: 1px solid var(--border); padding: 15px; display: flex; gap: 15px; justify-content: center; position: sticky; top: 0; z-index: 100; flex-shrink: 0; }
        nav a { color: var(--muted); text-decoration: none; font-weight: 600; padding: 8px 16px; border-radius: 6px; transition: 0.2s; cursor: pointer; }
        nav a:hover, nav a.active { background: var(--border); color: white; }

        /* DASHBOARD HEADER */
        .dashboard-header { padding: 20px; max-width: 1400px; margin: 0 auto; width: 100%; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .progress-container { flex: 1; min-width: 300px; background: var(--card); padding: 15px; border-radius: 8px; border: 1px solid var(--border); }
        .progress-bar-bg { width: 100%; height: 12px; background: #0f172a; border-radius: 6px; overflow: hidden; margin-top: 8px; border: 1px solid var(--border); }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); width: 0%; transition: width 0.5s ease; }
        .stat-text { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 600; }

        .btn-primary { background: var(--accent); color: #0f172a; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary:hover { filter: brightness(1.1); }
        .nav-btn { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 10px 15px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .nav-btn:hover { background: var(--border); }

        /* TABLE WRAPPER */
        .table-wrapper { flex: 1; overflow: auto; padding: 0 20px 20px 20px; max-width: 1400px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--card); border-radius: 8px; border: 1px solid var(--border); }
        
        thead { position: sticky; top: 0; z-index: 10; background: var(--card); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); }
        th { padding: 12px; text-align: center; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); color: #cbd5e1; font-weight: 700; font-size: 0.9rem; }
        td { padding: 8px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); font-size: 0.85rem; cursor: pointer; transition: 0.2s; }
        th:last-child, td:last-child { border-right: none; }
        
        /* TABLE STYLES */
        .col-day { font-weight: 800; color: var(--accent); text-align: center; }
        .col-date { color: var(--muted); font-size: 0.85rem; text-align: center; }
        .is-today { background: rgba(56, 189, 248, 0.1) !important; border: 2px solid var(--accent); }
        .is-today td { font-weight: bold; color: white; }
        
        /* CLICKABLE GREEN CELLS */
        td:hover:not(.col-day):not(.col-date) { background: rgba(255, 255, 255, 0.05); }
        .cell-done { background: rgba(16, 185, 129, 0.15) !important; color: var(--green); border-bottom: 1px solid var(--green); border-right: 1px solid var(--green); }
        .cell-content { display: flex; justify-content: space-between; align-items: center; gap: 8px; pointer-events: none; }
        .target-text { flex: 1; }
        
        /* CHECKBOXES */
        input[type="checkbox"] { appearance: none; -webkit-appearance: none; width: 18px; height: 18px; background: #0f172a; border: 2px solid var(--border); border-radius: 4px; pointer-events: auto; cursor: pointer; position: relative; transition: 0.2s; flex-shrink: 0; }
        input[type="checkbox"]:checked { background: var(--green); border-color: var(--green); }
        input[type="checkbox"]:checked::after { content: '✔'; position: absolute; color: #0f172a; font-size: 12px; font-weight: 900; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="active">📅 Daily Plan ☁️</a>
        <a href="syllabus_tracker.html">📚 Syllabus</a>
        <a href="mock_scores.html">📊 Mock Scores</a>
        <a href="quiz_log.html">🧠 Quiz Log ☁️</a>
    </nav>

    <div class="dashboard-header">
        <div class="progress-container">
            <div class="stat-text">
                <span>103-Day Completion Tracker (Cloud Synced)</span>
                <span id="progressText" style="color:var(--green);">0%</span>
            </div>
            <div class="progress-bar-bg"><div class="progress-fill" id="progressBar"></div></div>
        </div>
        <div style="display:flex; gap:10px; align-items: center;">
            <span id="cloudStatus" style="color: var(--accent); font-size: 0.85rem; font-weight: bold; margin-right: 15px;">⏳ Connecting...</span>
            <button onclick="goToToday()" class="btn-primary">Go To Today 🎯</button>
        </div>
    </div>

    <div class="table-wrapper">
        <table id="trackerTable">
            <thead>
                <tr>
                    <th colspan="2" rowspan="2" style="background: #162032; border-radius: 8px 0 0 0; color: var(--accent); font-size: 1.3rem; font-weight: 800; vertical-align: middle; text-shadow: 0 2px 4px rgba(0,0,0,0.3);">
                        DAY <span id="currentDayDisplay" style="color: white;">0</span><span style="font-size: 0.9rem; color: #94a3b8;">/103</span>
                    </th>
                    <th colspan="3" style="border-radius: 8px 8px 0 0;">SSC Group</th>
                    <th colspan="2" style="border-radius: 8px 8px 0 0;">RRB Group</th>
                    <th style="border-radius: 8px 8px 0 0;">UPSI</th>
                </tr>
                <tr>
                    <th style="color: #fca5a5;">RBE Daily Targets</th>
                    <th style="color: #fcd34d;">GS PARMAR 4.0</th>
                    <th style="color: #86efac;">ENGLISH AMAN SIR</th>
                    <th style="color: #93c5fd;">GS</th>
                    <th style="color: #c4b5fd;">MATH/RESONING</th>
                    <th style="color: #fbcfe8;">Hindi</th>
                </tr>
                <tr>
                    <th>Day</th>
                    <th>Date</th>
                    <th>9AM - 3PM</th>
                    <th>3.30PM - 5PM</th>
                    <th>5PM - 6PM</th>
                    <th>8PM - 9PM</th>
                    <th>10PM - 12PM</th>
                    <th>12AM - 2AM</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>

<script type="module">
    // --- FIREBASE CLOUD SETUP ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCVAXOdqKnBgFKSe3tKn0omfeib4AdfzVU",
      authDomain: "ssc-command-center-285cd.firebaseapp.com",
      projectId: "ssc-command-center-285cd",
      storageBucket: "ssc-command-center-285cd.firebasestorage.app",
      messagingSenderId: "512383276315",
      appId: "1:512383276315:web:95da05a6a05d3efb48efbe",
      measurementId: "G-G3DWYBB80L"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- TABLE GENERATION ---
    const TOTAL_DAYS = 103;
    const START_DATE = new Date('2026-02-18T00:00:00'); 
    
    function generateTable() {
        const tbody = document.getElementById('tableBody');
        let html = '';
        let activeDayNumber = "0"; 

        const todayStr = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' }).replace(/\//g, '-');

        for (let i = 1; i <= TOTAL_DAYS; i++) {
            const d = new Date(START_DATE);
            d.setDate(START_DATE.getDate() + (i - 1));
            
            const dd = String(d.getDate()).padStart(2, '0');
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const yyyy = d.getFullYear();
            const dateStr = `${dd}-${mm}-${yyyy}`;

            const isToday = (dateStr === todayStr);
            const rowClass = isToday ? 'is-today' : '';
            const rowId = isToday ? 'todayRow' : `row-${i}`;
            
            if (isToday) activeDayNumber = i;

            // Generate cell function to include specific Text Targets + Checkbox
            const createCell = (slotNum, text) => `
                <td onclick="window.toggleTask('d${i}-s${slotNum}', this)">
                    <div class="cell-content">
                        <span class="target-text">${text}</span>
                        <input type="checkbox" id="d${i}-s${slotNum}" class="task-chk" onclick="event.stopPropagation(); window.toggleCheckboxOnly(this, this.closest('td'))">
                    </div>
                </td>
            `;

            html += `
                <tr class="${rowClass}" id="${rowId}">
                    <td class="col-day">Day ${i}</td>
                    <td class="col-date">${dateStr}</td>
                    ${createCell(1, `RBE Target ${i}`)}
                    ${createCell(2, `Parmar Lecture ${i}`)}
                    ${createCell(3, `English Vocab/Grammar`)}
                    ${createCell(4, `GS Revision`)}
                    ${createCell(5, `Maths/Reasoning Prac`)}
                    ${createCell(6, `Hindi Target ${i}`)}
                </tr>
            `;
        }

        tbody.innerHTML = html;
        document.getElementById('currentDayDisplay').innerText = activeDayNumber;
    }

    // --- CELL TOGGLE & CLOUD SYNC LOGIC ---

    // When the whole <td> is clicked
    window.toggleTask = (id, tdElement) => {
        const chk = document.getElementById(id);
        chk.checked = !chk.checked; // Flip the checkbox
        window.updateUIAndCloud(id, chk.checked, tdElement);
    };

    // When only the little checkbox is clicked directly
    window.toggleCheckboxOnly = (chkElement, tdElement) => {
        window.updateUIAndCloud(chkElement.id, chkElement.checked, tdElement);
    };

    // Master function to handle green background and cloud save
    window.updateUIAndCloud = async (id, isChecked, tdElement) => {
        // 1. Instantly update UI (Optimistic Update)
        if (isChecked) {
            tdElement.classList.add('cell-done');
        } else {
            tdElement.classList.remove('cell-done');
        }
        window.updateProgressBar();

        // 2. Save silently to Firebase
        document.getElementById('cloudStatus').innerText = "☁️ Saving...";
        try {
            await setDoc(doc(db, "ssc_daily_plan", "progress"), {
                [id]: isChecked
            }, { merge: true });
            document.getElementById('cloudStatus').innerText = "☁️ Synced";
        } catch(e) {
            console.error("Firebase Sync Error", e);
            document.getElementById('cloudStatus').innerText = "❌ Sync Error";
        }
    };

    // --- PROGRESS BAR ---
    window.updateProgressBar = () => {
        const total = document.querySelectorAll('.task-chk').length;
        const checked = document.querySelectorAll('.task-chk:checked').length;
        const percentage = total === 0 ? 0 : Math.round((checked / total) * 100);
        
        document.getElementById('progressBar').style.width = percentage + '%';
        document.getElementById('progressText').innerText = percentage + '% Complete';
    };

    // --- GO TO TODAY ---
    window.goToToday = () => {
        const row = document.getElementById('todayRow');
        if (row) {
            row.scrollIntoView({ behavior: 'smooth', block: 'center' });
            row.style.backgroundColor = 'rgba(16, 185, 129, 0.3)';
            setTimeout(() => { row.style.backgroundColor = ''; }, 1000);
        } else {
            alert("Today's date is outside the 103-Day tracker range!");
        }
    };

    // --- LOAD CLOUD DATA ON STARTUP ---
    async function loadCloudProgress() {
        try {
            const docSnap = await getDoc(doc(db, "ssc_daily_plan", "progress"));
            if (docSnap.exists()) {
                const data = docSnap.data();
                
                // Loop through all checkboxes and apply cloud data
                document.querySelectorAll('.task-chk').forEach(chk => {
                    if (data[chk.id] === true) {
                        chk.checked = true;
                        chk.closest('td').classList.add('cell-done');
                    }
                });
                window.updateProgressBar();
            }
            document.getElementById('cloudStatus').innerText = "☁️ Synced";
        } catch(e) {
            console.error("Error loading cloud data", e);
            document.getElementById('cloudStatus').innerText = "❌ Offline Mode";
        }
    }

    // Initialize the Application
    generateTable();
    loadCloudProgress(); // Fetch checkboxes from cloud
    
    // Delay scroll slightly to ensure DOM is fully rendered
    setTimeout(window.goToToday, 500); 

</script>
</body>
</html>
